[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_PATH = "/app/node_modules/.bin"

[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]
nixpkgsArchive = "e6f23dc08d3624daab7094b701aa3954923c6bbb"

[phases.install]
cmds = ["npm ci", "npm rebuild better-sqlite3"]

[phases.build]
cmds = ["npm run build"]
cacheDirectories = [".next/cache", "node_modules/.cache"]

[start]
cmd = "npm start"
